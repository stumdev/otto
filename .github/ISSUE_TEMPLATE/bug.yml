name: Relatar um bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o app e ...
        2. Toquei em ...
        3. Vi o erro ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Onde acontece
      options: [App Android, Servidor, Conexão com o banco (Pluggy), Chat com IA, Não sei]
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do Android e modelo do celular; ou versão do Node (`node -v`) se for o servidor.
      placeholder: Android 15, Pixel 8 / Node 24
  - type: markdown
    attributes:
      value: "⚠️ Nunca cole chaves (Pluggy, Groq, Gemini), tokens de sessão, e-mails ou dados da sua conta bancária aqui."
