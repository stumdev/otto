# Otto — servidor.
#   cp .env.example .env   (MOCK_MODE=true para dados fictícios; false + chaves da Pluggy para o real)
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/health
#
# Por padrão a porta só escuta em 127.0.0.1 (não fica exposta na rede).
# Exponha para fora apenas por HTTPS (Caddy ou Cloudflare Tunnel — veja o README).
# Para testar com o celular na rede local: OTTO_BIND=0.0.0.0 docker compose up -d

services:
  otto:
    build: ./server
    image: otto-server:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      PORT: "8080"
    ports:
      - "${OTTO_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/data
      # coloque aqui o firebase-service-account.json (opcional) e use
      # FIREBASE_SERVICE_ACCOUNT_FILE=/run/secrets/otto/firebase-service-account.json
      - ./secrets:/run/secrets/otto:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Opcional: Cloudflare Tunnel (HTTPS sem abrir portas no roteador).
  # Ative com:  CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  # No painel da Cloudflare, aponte o hostname público para http://otto:8080
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - otto
